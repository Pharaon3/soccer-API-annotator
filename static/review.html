<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Review saved soccer video annotations." />
  <title>Review — Soccer Video Annotator</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/polyfills.js"></script>
</head>
<body class="page-review" data-page="review">
  <div id="app-boot" class="app-boot" aria-live="polite">
    <div class="app-boot-card">
      <div class="app-boot-spinner" aria-hidden="true"></div>
      <p class="app-boot-text">Loading…</p>
    </div>
  </div>

  <div id="reviewer-screen" class="screen active">
    <header class="top-bar reviewer-bar">
      <h1>Review annotations</h1>
      <div class="reviewer-actions">
        <a href="/" class="small-btn nav-link">Home</a>
        <a href="/annotator" class="small-btn nav-link">Annotator</a>
        <a href="/train" class="small-btn nav-link">Train</a>
        <button type="button" id="btn-refresh-videos" class="small-btn">Refresh</button>
        <button type="button" id="btn-logout" class="small-btn" data-action="logout">Log out</button>
      </div>
    </header>
    <div class="reviewer-layout">
      <aside class="video-list-panel">
        <h2>Saved videos</h2>
        <div class="date-picker">
          <span class="date-picker-label">Jump to date</span>
          <button type="button" id="btn-date-picker-open" class="date-picker-trigger" aria-controls="video-date-filter">
            <span class="date-picker-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M7 2a1 1 0 0 1 1 1v1h8V3a1 1 0 1 1 2 0v1h1.5A2.5 2.5 0 0 1 22 6.5v13A2.5 2.5 0 0 1 19.5 22h-15A2.5 2.5 0 0 1 2 19.5v-13A2.5 2.5 0 0 1 4.5 4H6V3a1 1 0 0 1 1-1zm13 9H4v8.5c0 .28.22.5.5.5h15c.28 0 .5-.22.5-.5V11zM6 6h-.5a.5.5 0 0 0-.5.5V9h14V6.5a.5.5 0 0 0-.5-.5H18v1a1 1 0 1 1-2 0V6H8v1a1 1 0 0 1-2 0V6z"/></svg>
            </span>
            <span id="video-date-filter-label" class="date-picker-value">All dates</span>
            <span class="date-picker-chevron" aria-hidden="true">▾</span>
          </button>
          <input type="date" id="video-date-filter" class="date-picker-input" tabindex="-1" aria-hidden="true" />
          <div class="date-picker-quick">
            <button type="button" class="date-picker-chip" data-date-quick="today">Today</button>
            <button type="button" class="date-picker-chip" data-date-quick="yesterday">Yesterday</button>
            <button type="button" id="btn-clear-date-filter" class="date-picker-chip date-picker-chip-muted">Clear</button>
          </div>
        </div>
        <ul id="video-list" class="video-list-grouped"></ul>
      </aside>
      <section class="reviewer-main">
        <div class="board-video-wrap">
          <video id="reviewer-video" playsinline preload="auto"></video>
          <label class="playback-speed-control">
            <span>Speed</span>
            <input type="number" class="playback-speed-input" data-playback-speed-input min="0.1" step="0.1" value="1" inputmode="decimal" aria-label="Video playback speed" />
          </label>
          <div id="board-video-loading" class="board-video-loading hidden" aria-live="polite" aria-busy="true">
            <div class="board-video-loading-card">
              <div class="cat-loader-box" aria-hidden="true">
                <div class="cat-loader">
                  <div class="cat-loader__body"></div>
                  <div class="cat-loader__body"></div>
                  <div class="cat-loader__tail"></div>
                  <div class="cat-loader__head"></div>
                </div>
              </div>
              <p class="board-video-loading-text">Loading video…</p>
            </div>
          </div>
        </div>
        <div class="board-video-controller video-controller">
          <div class="video-controller-controls">
            <!-- <button type="button" id="board-btn-play-pause" class="ctrl-btn">▶</button> -->
          </div>
          <div class="video-timeline" id="board-video-timeline">
            <div class="timeline-live-readout" aria-hidden="true">
              <span id="board-video-frame-display" class="timeline-live-frame">0</span>
              <!-- <span id="board-video-time-display" class="timeline-live-time">0.0</span> -->
            </div>
            <div id="board-timeline-track" class="timeline-track" aria-hidden="true"></div>
            <input type="range" id="board-video-seek" class="video-seek" min="0" max="30" step="0.01" value="0" />
            <div id="board-timeline-markers" class="timeline-markers"></div>
          </div>
        </div>
        <div id="reviewer-meta" class="reviewer-meta"></div>
      </section>
      <aside class="reviewer-events-sidebar">
        <h2>Annotations</h2>
        <ul id="reviewer-events"></ul>
      </aside>
    </div>
  </div>

  <video id="annotator-video" class="sr-only" playsinline></video>

  <script src="/app.js"></script>
</body>
</html>
