<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sign in to the Large LLM/GPU." />
  <title>Login — Large LLM/GPU</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="page-login">
  <div class="card auth-card">
    <h1>Large LLM/GPU</h1>
    <p class="subtitle">Sign in with your user account</p>
    <form id="login-form" class="auth-form">
      <label>
        User ID
        <input type="text" id="login-user-id" autocomplete="username" required autocapitalize="none" spellcheck="false" />
      </label>
      <label>
        Password
        <input type="password" id="login-password" autocomplete="current-password" required />
      </label>
      <button type="submit" class="role-btn primary">Log in</button>
    </form>
    <p id="auth-message" class="status-text" role="alert"></p>
  </div>
  <script src="/login.js"></script>
</body>
</html>
