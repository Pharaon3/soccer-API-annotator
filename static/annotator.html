<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Crowd-sourced soccer event annotation for short video clips." />
  <title>Annotator — Soccer Video Annotator</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body class="page-annotate" data-page="annotator">
  <div id="app-boot" class="app-boot" aria-live="polite">
    <div class="app-boot-card">
      <div class="app-boot-spinner" aria-hidden="true"></div>
      <p class="app-boot-text">Loading…</p>
    </div>
  </div>

  <div id="annotator-screen" class="screen active">
    <div class="annotator-layout">
      <div class="annotator-main">
        <main class="video-wrap">
          <div class="video-aspect">
            <video id="annotator-video" playsinline preload="auto"></video>
            <div id="api-countdown" class="api-countdown video-countdown hidden" aria-live="polite">
              <span id="countdown-value" class="countdown-value">—</span>
              <span class="countdown-unit">s</span>
            </div>
            <div id="api-next-video-countdown" class="api-next-video-countdown hidden" aria-live="polite">
              <div class="api-next-video-hint">Next challenge in</div>
              <div id="api-next-video-value" class="api-next-video-value">—</div>
            </div>
            <div id="video-ready" class="video-ready hidden">READY</div>
            <div id="event-overlay" class="event-overlay hidden"></div>
          </div>
          <div class="annotator-bottom">
            <div class="video-controller">
              <div class="video-controller-controls">
              <!-- <button type="button" id="btn-play-pause" class="ctrl-btn" title="Play / Pause" aria-label="Play / Pause">▶</button> -->
              </div>
              <div class="video-timeline" id="video-timeline">
                <div class="timeline-live-readout" aria-hidden="true">
                  <span id="video-frame-display" class="timeline-live-frame">0</span>
                  <!-- <span id="video-time-display" class="timeline-live-time">0.0</span> -->
                </div>
                <div id="timeline-track" class="timeline-track" aria-hidden="true"></div>
                <input type="range" id="video-seek" class="video-seek" min="0" max="30" step="0.01" value="0" />
                <div id="timeline-markers" class="timeline-markers"></div>
              </div>
            </div>
            <div id="label-buttons" class="label-grid"></div>
          </div>
        </main>
      </div>

      <aside class="events-sidebar">
        <section class="events-panel">
          <div class="sidebar-toolbar">
            <a href="/" class="small-btn nav-link">Home</a>
            <a href="/board" class="small-btn nav-link">Board</a>
            <a href="/practice" class="small-btn nav-link">Practice</a>
            <button type="button" id="btn-presence" class="presence-btn online">Online</button>
            <button type="button" id="btn-logout" class="small-btn" data-action="logout">Log out</button>
            <!-- <div id="api-next-countdown" class="api-countdown api-next-countdown hidden" aria-live="polite">
              <span class="countdown-hint">Next Challenge</span>
              <span id="api-next-value" class="countdown-value">—</span>
            </div> -->
          </div>
          <p id="connection-status" class="connection-status hidden" role="alert"></p>
          <h2>Events this session</h2>
          <ul id="events-list"></ul>
        </section>
        <span id="annotator-badge" class="sr-only">Annotator</span>
        <span id="session-info" class="sr-only"></span>
        <span id="job-info" class="sr-only"></span>
      </aside>
    </div>
  </div>

  <div id="presence-overlay" class="presence-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="presence-overlay-title">
    <div class="presence-overlay-card">
      <p id="presence-overlay-title" class="presence-overlay-title">You've been idle for 15 minutes</p>
      <p class="presence-overlay-hint">You are offline and will not receive new tasks until you confirm.</p>
      <button type="button" id="btn-presence-confirm" class="presence-overlay-btn">I am Online</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
