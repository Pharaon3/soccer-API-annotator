<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Practice annotation rounds on saved videos." />
  <title>Train — Soccer Annotator</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/polyfills.js"></script>
</head>
<body class="page-test" data-page="train">
  <div id="app-boot" class="app-boot" aria-live="polite">
    <div class="app-boot-card">
      <div class="app-boot-spinner" aria-hidden="true"></div>
      <p class="app-boot-text">Loading…</p>
    </div>
  </div>

  <div id="annotator-screen" class="screen">
    <div class="annotator-layout">
      <div class="annotator-main">
        <main class="video-wrap">
          <div class="video-aspect">
            <video id="annotator-video" playsinline preload="auto"></video>
            <label class="playback-speed-control">
              <span>Speed</span>
              <input type="number" class="playback-speed-input" data-playback-speed-input min="0.1" step="0.1" value="1" inputmode="decimal" aria-label="Video playback speed" />
            </label>
            <div id="api-countdown" class="api-countdown video-countdown hidden" aria-live="polite">
              <span id="countdown-value" class="countdown-value">—</span>
              <span class="countdown-unit">s</span>
            </div>
            <div id="video-ready" class="video-ready hidden">READY</div>
            <div id="event-overlay" class="event-overlay hidden"></div>
          </div>
          <div class="annotator-bottom">
            <div class="video-controller">
              <!-- <button type="button" id="btn-play-pause" class="ctrl-btn" title="Play / Pause" aria-label="Play / Pause">▶</button> -->
              <div class="video-timeline" id="video-timeline">
                <div class="timeline-live-readout" aria-hidden="true">
                  <span id="video-frame-display" class="timeline-live-frame">0</span>
                  <!-- <span id="video-time-display" class="timeline-live-time">0.0</span> -->
                </div>
                <input type="range" id="video-seek" class="video-seek" min="0" max="0" step="0.01" value="0" />
                <div id="timeline-markers" class="timeline-markers"></div>
              </div>
            </div>
            <div id="label-buttons" class="label-grid"></div>
          </div>
        </main>
      </div>

      <aside class="events-sidebar">
        <section class="events-panel">
          <div class="sidebar-toolbar">
            <a href="/" class="small-btn nav-link">Home</a>
            <a href="/annotator" class="small-btn nav-link">Annotator</a>
            <a href="/review" class="small-btn nav-link">Review</a>
            <button type="button" id="btn-logout" class="small-btn" data-action="logout">Log out</button>
            <div id="test-next-countdown" class="api-countdown test-next-countdown hidden" aria-live="polite">
              <span id="test-next-value" class="countdown-value">—</span>
              <span class="countdown-unit">s</span>
              <span class="countdown-hint">next test</span>
            </div>
          </div>
          <h2>Events this round</h2>
          <ul id="events-list"></ul>
        </section>
        <span id="session-info" class="sr-only"></span>
        <span id="job-info" class="sr-only"></span>
      </aside>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
